name: Build iOS

# iOS builds REQUIRE macOS. GitHub's macOS runners provide it, so no Mac hardware is needed.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }

      - run: npm ci || npm install
      - run: npx cap sync ios
      - run: cd ios/App && pod install

      # Unsigned build: proves it compiles. Produces no installable .ipa.
      - name: Build (unsigned)
        if: ${{ secrets.IOS_CERT_BASE64 == '' }}
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      # Signed build -> .ipa -> TestFlight. Needs the secrets in DISTRIBUTION.md.
      - name: Import signing assets
        if: ${{ secrets.IOS_CERT_BASE64 != '' }}
        env:
          CERT: ${{ secrets.IOS_CERT_BASE64 }}
          CERT_PW: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          security create-keychain -p runner build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p runner build.keychain
          echo "$CERT" | base64 -d > cert.p12
          security import cert.p12 -k build.keychain -P "$CERT_PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k runner build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Archive and export
        if: ${{ secrets.IOS_CERT_BASE64 != '' }}
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos -archivePath build/App.xcarchive archive
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/ipa

      - name: Upload to TestFlight
        if: ${{ secrets.APPSTORE_API_KEY_BASE64 != '' }}
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo "$KEY" | base64 -d > ~/private_keys/AuthKey_$KEY_ID.p8
          xcrun altool --upload-app -f ios/App/build/ipa/App.ipa -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - uses: actions/upload-artifact@v4
        if: ${{ secrets.IOS_CERT_BASE64 != '' }}
        with:
          name: ios-ipa
          path: ios/App/build/ipa/*.ipa
